[project]
name = "hearmeout-api"
version = "0.1.0"
description = "HearMeOut backend: document extraction, text-to-speech orchestration, quotas and billing."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "edge-tts>=7.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "pysbd>=0.3.4",
  "py3langid>=0.2.2",
  "pyjwt[crypto]>=2.9",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "trafilatura>=2.0",
  "python-multipart>=0.0.9",
  "dodopayments>=1.0",
  "standardwebhooks>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "reportlab>=4.2", "rapidocr>=3.9", "onnxruntime>=1.20", "pillow>=10"]
ocr = ["rapidocr>=3.9", "onnxruntime>=1.20", "pillow>=10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]
